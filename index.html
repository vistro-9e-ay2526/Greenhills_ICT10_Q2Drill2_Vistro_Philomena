<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--Py-script CDN-->
        <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
        <!-- This script tag bootstraps PyScript -->
        <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>   
    <title>Member Addition System</title>
    <style>
        body{
            background: linear-gradient(90deg, rgb(53, 53, 81), #4a5158, rgb(72, 98, 72));
            min-height:100vh;
            font-family: Georgia, serif;
            color:#d7d7d7;
        }
        nav{
            border-top:3px solid #2a2d37;
            border-bottom:3px solid #2a2d37;
            padding:2px;
            width: 100%;
        }
        #nav{
            color:rgb(211, 205, 205);
            font-size:15px;
        }
        h1{
            text-align:center;
            font-size:45px;
            margin-top:50px;
            color:rgb(163, 175, 160);
        }
        h5{
            text-align:center;
            font-size:20px;
            color:rgb(130, 143, 127);
            margin-top:20px;
        }
        hr{
            width:60%;
            margin:60px auto;
            border:1px solid #403333;
        }
        .row{
            display:flex;
            justify-content:center;
            align-items:flex-start;
            gap:120px;
            margin-top:40px;
        }
        .form-column{
            margin-top:20px;
        }
        input[type="text"]{
            width:250px;
            padding:5px;
            margin-bottom:20px;
            border:3px solid #4b3d74;
            background:#ececec;
            font-size:15px;
        }
        input[type="button"]{
            width:230px;
            height:40px;
            border: 1px solid black;
            border-radius:35px;
            background:#8d180b;
            color:white;
            font-size:15px;
            cursor:pointer;
            display:block;
            margin:20px auto;
        }
        input[type="button"]:hover{
            background:#a31d0d;
        }
        #output{
            background-color: rgb(42, 37, 37);
            border-color: rgb(90, 29, 29);
            border-style: groove;
            padding: 20px;
            max-width: 360px;
            margin:auto;
            margin-top: 40px;
            box-shadow: 0px 5px 1px rgba(0,0,0,0.1);
        }
        .output-title{
            background:#8d180b;
            padding:6px 10px;
            display:inline-block;
            font-weight:bold;
            margin-bottom:20px;
        }
        .member-count{
            background:#8d180b;
            display:inline-block;
            padding:6px 10px;
            margin-top:25px;
            font-weight:bold;
        }
        footer{
            position:fixed;
            bottom:0;
            width:100%;
            background:#131920;
            border-top:3px solid #2f3a68;
            text-align:center;
            padding:5px;
        }

        #footer{
            color:#d7d7d7;
            font-size:10px;
        }
    </style>
</head>
<body>
     <nav>
        <div class="nav-container">
             <div class="nav-left"><h2 id="nav">The FAYZ Club</h2></div>
             <div class="nav-right"></div>
        </div>
    </nav>
    <h1>The FAYZ Club</h1>
    <h5>Member Addition System</h5>
    <hr>
    <div class="row">
        <div class="column">
            <form>
            <input type="text" id="firstname" placeholder="Enter First Name"><br>
            <input type="text" id="lastname" placeholder="Enter Last Name"><br>
            <input type="button" py-click="add_member" value="Add Member">
            </form>
        </div>
        <div class="column">
            <div id="output"></div>
        </div>
    </div>

    <footer>
         <p id="footer">©2026 | The FAYZ</p>
    </footer>

    <py-script src="main.py"></py-script>
</body>
</html>
